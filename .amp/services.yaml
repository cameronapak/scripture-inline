services:
  docs:
    command: pnpm dev --port "$PORT" --strictPort
    # The same port as a plain `pnpm dev`, so earlier portal links keep working.
    port: 5173
    health: /
    portal:
      title: Scripture Inline docs
      description: Docs and live demos. Cards and passages need VITE_YVP_APP_KEY in the environment or .env.local.
